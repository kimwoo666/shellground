name: Desktop release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/windows_release.json

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            python: ./.venv/Scripts/python.exe
            root_python: ./desktop/.venv/Scripts/python.exe
          - os: ubuntu-22.04
            platform: linux
            python: ./.venv/bin/python
            root_python: ./desktop/.venv/bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.16'
          enable-cache: false
      - name: Create the pinned native Python environment
        run: |
          uv python install 3.12.14
          uv venv desktop/.venv --python 3.12.14
      - name: Install native build dependencies
        run: uv pip install --python "${{ matrix.root_python }}" -r desktop/requirements-${{ matrix.platform }}-lock.txt
      - name: Install Linux GUI system libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 xvfb
          ./desktop/.venv/bin/python -c "import tkinter; print('Installer Tk', tkinter.TkVersion)"
      - name: Check startup, shutdown and UI regressions
        working-directory: desktop
        run: ${{ matrix.python }} -m unittest test_windows_vm test_windows_stdio test_windows_boot_contract test_platform_runtime test_ros_grading test_real_vm test_vm_resources test_prewarm test_prewarm_ui test_study_window -v
      - name: Check native Linux lifetime and installer
        if: matrix.platform == 'linux'
        run: |
          cd desktop
          ./.venv/bin/python -m unittest test_vm_supervisor -v
          cd installer
          ../.venv/bin/python -m unittest test_installer -v
      - name: Build and check the native executable and installer
        run: ${{ matrix.root_python }} desktop/build_${{ matrix.platform }}_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          compression-level: 0
          if-no-files-found: error
          path: |
            desktop/dist-${{ matrix.platform }}-release/*.exe
            desktop/dist-${{ matrix.platform }}-release/*.zip
            desktop/dist-${{ matrix.platform }}-release/*.tar
            desktop/dist-${{ matrix.platform }}-release/*.run
            desktop/dist-${{ matrix.platform }}-release/*-build.json

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-output
      - name: Publish both native desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python3 -c "import json; print(json.load(open('desktop/windows_release.json'))['tag'])")
          version=$(python3 -c "import json; print(json.load(open('desktop/windows_release.json'))['version'])")
          if gh release view "$tag" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            python3 -c "import json,os; r=json.load(open('release-state.json')); assert r['isDraft'] and r['targetCommitish']==os.environ['GITHUB_SHA'], 'Bump the release version before publishing again'"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Shellground $version — Windows · Linux" --notes-file docs/WINDOWS_RELEASE_NOTES.md
          fi
          (cd release-output && sha256sum *.exe *.zip *.tar *.run > SHA256SUMS.txt)
          gh release upload "$tag" release-output/* --clobber
          gh release edit "$tag" --draft=false --latest
